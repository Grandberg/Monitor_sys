version: '3.8'

services:
  monitor:
    build: .
    container_name: vps-monitor
    restart: unless-stopped
    # privileged is required to execute host commands (chroot, reboot, shutdown)
    # and to access the host's system directories properly.
    privileged: true
    # network_mode: host allows monitoring host network interfaces directly
    network_mode: host
    environment:
      - TELEGRAM_BOT_TOKEN
      - ALLOWED_CHAT_IDS
      - CPU_THRESHOLD
      - RAM_THRESHOLD
      - DISK_THRESHOLD
      - CHECK_INTERVAL
      - ALERT_COOLDOWN
      - CPU_ALERT_DELAY
      - RAM_ALERT_DELAY
      - HOST_ROOT_PATH
      - PROCFS_PATH=/host/proc
      - PYTHONPATH=/app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Mount host root to execute commands via chroot /host/root
      - /:/host/root:rw
